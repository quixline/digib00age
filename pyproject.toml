[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digib00age"
version = "1.0.0"
description = "Self-hosted personal comic library server"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",  # floor: CORSMiddleware reflects the actual Origin instead of a
                       # literal "*" whenever allow_credentials=True (see main.py CORS setup)
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "pillow",
    "pystray[appindicator] ; sys_platform == 'linux'",
    "pystray ; sys_platform != 'linux'",
    "pywin32 ; sys_platform == 'win32'",
    "watchdog",
    "lxml",
    "rarfile",
    "pymupdf",
    "comictagger @ git+https://github.com/comictagger/comictagger.git@0cc9e76f8d45d3ef27bcf2feabb676e124412abf",
]

[project.optional-dependencies]
# Backend regression suite — see dev/tests/ (gitignored) and dev/docs/TESTING.md.
# Not installed by default; `pip install -e .[test]` once locally.
test = ["pytest", "httpx"]

[project.scripts]
digib00age-server = "backend.cli:main"
digib00age-tray = "tray.tray_app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["backend", "backend.*", "tray", "frontend"]

[tool.setuptools.package-data]
"backend.editor" = ["*.json"]
"backend" = ["bin/linux/*", "bin/windows/*"]
# Revision filenames (e.g. 0001_baseline.py) aren't valid import identifiers —
# Alembic loads them by filesystem path, not via Python's import system, so
# they need an explicit glob to guarantee inclusion in a built sdist/wheel.
"backend.migrations.versions" = ["*.py"]
"frontend" = [
    "*.html",
    "*.json",
    "sw.js",
    "css/*.css",
    "js/*.js",
    "images/*.png",
    "images/icons/*.png",
]
