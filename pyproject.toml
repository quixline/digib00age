[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digib00age"
version = "1.0.0"
description = "Self-hosted personal comic library server"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",  # floor: CORSMiddleware reflects the actual Origin instead of a
                       # literal "*" whenever allow_credentials=True (see main.py CORS setup)
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "pillow",
    "pystray[appindicator] ; sys_platform == 'linux'",
    "pystray ; sys_platform != 'linux'",
    "pywin32 ; sys_platform == 'win32'",
    "watchdog",
    "lxml",
    "rarfile",
    "pymupdf",
    # ComicTagger's own transitive runtime deps — needed directly now that
    # comicapi/comictalker/comictaggerlib are vendored under backend/vendor/
    # instead of pip-installed (dev/docs/comictagger-vendoring-scope.md,
    # v2.6 Item 11, Step 5). pyrate-limiter deliberately excluded: comicvine.py
    # imports comictalker's own embedded vendor/pyrate_limiter/ copy, not the
    # real pip package.
    "appdirs==1.4.4",
    "beautifulsoup4>=4.1",
    "chardet>=5.1.0,<6",
    "comicfn2dict>=0.2.1",
    "importlib-metadata>=3.3.0",
    "isocodes>=2025.8.22",
    "natsort>=8.1.0",
    "packaging>=20",
    "pathvalidate",
    "pyyaml",
    "requests==2.*",
    "settngs==0.11.0",
    "text2digits",
    "typing-extensions>=4.3.0",
    "wordninja",
    "zipremove",
]

[project.optional-dependencies]
# Backend regression suite — see dev/tests/ (gitignored) and dev/docs/TESTING.md.
# Not installed by default; `pip install -e .[test]` once locally.
test = ["pytest", "httpx"]

[project.scripts]
digib00age-server = "backend.cli:main"
digib00age-tray = "tray.tray_app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["backend", "backend.*", "tray", "frontend"]

[tool.setuptools.package-data]
"backend.editor" = ["*.json"]
"backend" = ["bin/linux/*", "bin/windows/*"]
# Vendored ComicTagger data (dev/docs/comictagger-vendoring-scope.md) -
# backend.vendor.* submodules get swept in as implicit namespace packages by
# setuptools' default discovery, but a non-.py data file still needs its own
# explicit glob the same way backend.editor's JSONs do above - confirmed by
# building the real wheel: publishers.json was silently absent without this.
"backend.vendor.comicapi.data" = ["*.json"]
# Revision filenames (e.g. 0001_baseline.py) aren't valid import identifiers —
# Alembic loads them by filesystem path, not via Python's import system, so
# they need an explicit glob to guarantee inclusion in a built sdist/wheel.
"backend.migrations.versions" = ["*.py"]
"frontend" = [
    "*.html",
    "*.json",
    "sw.js",
    "css/*.css",
    "js/*.js",
    "images/*.png",
    "images/icons/*.png",
]
