[alembic]
# script_location/sqlalchemy.url are NOT read at runtime by the app — see
# src/backend/migrations/env.py, which resolves the DB path dynamically from
# backend.config.DB_PATH instead. This file exists purely so a dev can run
# `alembic revision --autogenerate -m "..."` from the repo root.
script_location = src/backend/migrations
prepend_sys_path = . src
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S
