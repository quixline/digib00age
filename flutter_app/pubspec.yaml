name: comicvault
description: "ComicVault — comic reader for your home server and local collection"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.0.0
  archive: ^3.4.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  app_links: ^6.0.0
  cached_network_image: ^3.3.0
  path: ^1.8.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

flutter_launcher_icons:
  android: true
  image_path: "assets/logo/app_icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/logo/app_icon.png"
    icon_size: 256
