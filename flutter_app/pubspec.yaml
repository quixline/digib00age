name: comicvault
description: "ComicVault — comic reader for your home server and local collection"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.0.0
  archive: ^3.4.0
  path_provider: ^2.1.0
  file_selector: ^1.0.3
  shared_preferences: ^2.2.0
  app_links: ^6.0.0
  cached_network_image: ^3.3.0
  path: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
