name: comicvault
description: "ComicVault — comic reader for your home server and local collection"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.0.0
  archive: ^3.4.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  app_links: ^6.0.0
  cached_network_image: ^3.3.0
  path: ^1.8.0
  google_fonts: ^6.2.1
  win32: ^5.1.0
  ffi: ^2.1.0
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

flutter_launcher_icons:
  android: true
  image_path: "assets/logo/app_icon.png"
  min_sdk_android: 21
  # Android 8+ (API 26+) uses these instead of image_path — a flat legacy
  # icon gets auto-shrunk and re-padded by the OS on top of whatever
  # padding the source already has, which is why the flat app_icon.png
  # looked small next to properly-adaptive icons like Clock/Settings.
  # Background fills the full canvas (no baked-in corner rounding — the
  # launcher applies its own mask shape); foreground is glyph-only on a
  # transparent canvas, sized within Android's safe zone.
  adaptive_icon_background: "#0A5FFF"
  adaptive_icon_foreground: "assets/logo/app_icon_foreground.png"
  # Default is 16 — the tool would otherwise shrink our already-sized-to-68%
  # foreground by another 16% per side on top of its own padding. Our source
  # image already builds in the intended safe margin, so this stays 0.
  adaptive_icon_foreground_inset: 0
  windows:
    generate: true
    image_path: "assets/logo/app_icon.png"
    icon_size: 256
