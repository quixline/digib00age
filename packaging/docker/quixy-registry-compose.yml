# digib00age's self-hosted Docker registry - lives on quixy at /srv/registry/,
# NOT part of the digib00age repo build (this copy is kept here only as a reference
# for what's actually deployed on quixy - see dev/docs/DECISIONS.md).
#
# Stores images pushed by packaging/docker/publish.ps1 (run manually from windy) and
# pulled by packaging/docker/setup.sh / setup.ps1 on target machines via
# digib00age.tech:5000. Plain HTTP, LAN-only (ufw restricts 5000/tcp to
# 192.168.0.0/24) - not internet-facing, no TLS.
services:
  registry:
    image: registry:2
    container_name: digib00age-registry
    ports:
      - "5000:5000"
    volumes:
      - ./data:/var/lib/registry
    restart: unless-stopped
