# digib00age - example Docker Compose file. Copy this alongside a clone of
# the repo (or edit in place) and run `docker compose up -d --build` from
# the repo root. See README.txt in this folder for the full walkthrough.

# Normal bridge networking + port mapping. Earlier revisions of this file
# required network_mode: host as a workaround for a peer-IP-based "local
# machine" auth check that made first-run password setup unreachable behind
# Docker's default NAT (see DECISIONS.md, 2026-09-04 entries). That check has
# since been removed entirely - password state is the only auth boundary now,
# not network origin - so ordinary port mapping works fine again.
services:
  digib00age:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
    ports:
      - "9800:9800"
    volumes:
      # config.json lands here (XDG_CONFIG_HOME) - persists across container
      # rebuilds/restarts.
      - ./config:/config
      # DB + thumbnails land here (XDG_DATA_HOME).
      - ./data:/data
      # Passes the host's whole /mnt tree straight through, same path on
      # both sides - same approach qBittorrent's own container uses. Every
      # drive mounted under the host's /mnt (USB or otherwise, present or
      # future) just appears inside the container with its real name, no
      # per-drive line to add or edit here. Docker never auto-detects drives
      # itself (true of every containerized app, not a digib00age
      # limitation) - this works because /mnt is the one shared parent
      # directory that already contains all of them on the host.
      #
      # On first launch there's nothing pre-set - open the Admin page's
      # Library Folders > Browse picker, navigate to the real path under
      # /mnt (e.g. /mnt/your-drive-name/Comics), and add it as a Scan Root.
      # Add as many Scan Roots as you have drives/folders, all from the same
      # picker, no compose edits needed.
      #
      # If your host doesn't keep drives under /mnt (e.g. they're bind-
      # mounted or mapped elsewhere), replace this line with a mount for
      # whatever that parent location is, or fall back to mounting one
      # folder directly, e.g. - /path/to/your/comics:/library (still
      # supported: config.py pre-fills library_root as /library on first
      # boot if that path exists in the container).
      - /mnt:/mnt
    restart: unless-stopped
