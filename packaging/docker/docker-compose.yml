# digib00age - example Docker Compose file. Copy this alongside a clone of
# the repo (or edit in place) and run `docker compose up -d --build` from
# the repo root. See README.txt in this folder for the full walkthrough.

# Normal bridge networking + port mapping. Earlier revisions of this file
# required network_mode: host as a workaround for a peer-IP-based "local
# machine" auth check that made first-run password setup unreachable behind
# Docker's default NAT (see DECISIONS.md, 2026-09-04 entries). That check has
# since been removed entirely - password state is the only auth boundary now,
# not network origin - so ordinary port mapping works fine again.
services:
  digib00age:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
    ports:
      - "9800:9800"
    volumes:
      # config.json lands here (XDG_CONFIG_HOME) - persists across container
      # rebuilds/restarts.
      - ./config:/config
      # DB + thumbnails land here (XDG_DATA_HOME).
      - ./data:/data
      # Edit the left side to your real comic library path on the host.
      # The right side (/library) is what "library_root" is pre-filled with
      # on first launch (see backend/config.py's _IS_DOCKER) - it's just this
      # file's example mount name, not a hard limit. Docker never auto-detects
      # drives or USB devices (true of every containerized app, not a
      # digib00age limitation) - a folder only exists inside the container if
      # it has a line here. To add another location (e.g. a USB drive), first
      # give it a stable mount point on the host, then add another line below
      # with whatever container-side name you like, e.g.:
      #   - /mnt/usb-comics:/comics-usb
      # It'll then show up in the Admin page's Browse picker like /library
      # does, and can be added as an additional Scan Root.
      - /path/to/your/comics:/library
    restart: unless-stopped
