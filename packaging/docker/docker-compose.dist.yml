# digib00age - distributed Docker Compose file (pull-based, no build).
#
# This is the file packaging/docker/setup.sh / setup.ps1 downloads onto a target
# machine. Unlike packaging/docker/docker-compose.yml (which builds the image from a
# local repo clone - the windy dev/test path), this one just pulls a pre-built image
# from the self-hosted registry on quixy. No git, no source checkout, no build tools
# needed on the machine that runs this file.
#
# Published by packaging/docker/publish.ps1 (run manually on windy). See
# packaging/docker/README.txt for the full walkthrough of both paths.

services:
  digib00age:
    image: digib00age.tech:5000/digib00age:latest
    ports:
      - "9800:9800"
    volumes:
      # config.json lands here (XDG_CONFIG_HOME) - persists across container
      # restarts/updates.
      - ./config:/config
      # DB + thumbnails land here (XDG_DATA_HOME).
      - ./data:/data
      # Passes the host's whole /mnt tree straight through, same path on both sides.
      # See docker-compose.yml's comment for the full explanation and the single-folder
      # alternative (mount to /library instead).
      - /mnt:/mnt
    restart: unless-stopped
