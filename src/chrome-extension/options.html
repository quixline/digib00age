<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GoodReads → digib00age Bridge — Options</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.1rem; }
  p.hint { color: #555; }
  code { background: #f0f0f0; padding: 0.1em 0.35em; border-radius: 3px; }
  ul#origin-list { list-style: none; padding: 0; margin: 1rem 0; }
  ul#origin-list li { display: flex; align-items: center; justify-content: space-between; padding: 0.4rem 0.6rem; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 0.4rem; }
  ul#origin-list li button { margin-left: 0.75rem; }
  form#add-form { display: flex; gap: 0.5rem; margin-top: 1rem; }
  form#add-form input { flex: 1; padding: 0.4rem; }
  #status { margin-top: 0.75rem; min-height: 1.2em; font-size: 0.9em; }
  #status.error { color: #b00020; }
  #status.ok { color: #0a7d2c; }
</style>
</head>
<body>
  <h1>GoodReads → digib00age Bridge</h1>
  <p class="hint">
    <code>http://localhost:9800</code> works with no setup. Add other addresses
    your digib00age install is reached at (a LAN IP, a Docker host, a different
    port) below — each add asks Chrome to grant that address, since this
    extension never assumes a fixed machine.
  </p>

  <ul id="origin-list"></ul>

  <form id="add-form">
    <input id="origin-input" type="text" placeholder="http://192.168.0.151:9800" autocomplete="off">
    <button type="submit">Add</button>
  </form>

  <div id="status"></div>

  <script src="content-scripts-config.js"></script>
  <script src="options.js"></script>
</body>
</html>
