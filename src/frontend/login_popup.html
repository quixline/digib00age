<div id="loginOverlay" class="editor-overlay" hidden>
  <div class="editor-modal login-modal">
    <div class="editor-modal-header">
      <h2 class="editor-modal-title">Admin Login</h2>
    </div>

    <form id="loginForm">
      <div class="editor-field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" autocomplete="current-password" autofocus>
      </div>

      <div class="editor-error" id="loginError" hidden></div>

      <div class="editor-actions">
        <button type="button" class="btn-admin-action" id="loginCancelBtn">Cancel</button>
        <button type="submit" class="btn-primary" id="loginSubmitBtn">Log In</button>
      </div>
    </form>
  </div>
</div>
