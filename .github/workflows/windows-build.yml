name: Windows build (PyInstaller + WiX MSI)

# The repo-traceable build SignPath Foundation's signing verification needs
# (dev/docs/meta/... SignPath scoping) — not yet wired to an actual signing
# step; see packaging/windows/installer.wxs's header comment and
# dev/docs/ROADMAP.md "Apply to SignPath for free OSS code signing" for that
# follow-on. Manual trigger for now; switch to a release-tag trigger once
# this has run cleanly a few times.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build the pre-build staging mirror
        # Mirrors what Tez does by hand locally into
        # dev/distros/app-windows-pre-build-v1/ (see packaging/windows/
        # digib00age.spec's header comment) - backend/frontend/tray flattened
        # out of src/, plus the handful of repo-root files the frozen app
        # needs. dev/ doesn't exist in this checkout, so this step builds an
        # equivalent staging copy and points the spec at it via
        # DIGIB00AGE_STAGING instead of relying on the default path.
        shell: pwsh
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE "packaging\_staging"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item -Recurse -Force "src\backend" (Join-Path $staging "backend")
          Copy-Item -Recurse -Force "src\frontend" (Join-Path $staging "frontend")
          Copy-Item -Recurse -Force "src\tray" (Join-Path $staging "tray")
          Copy-Item -Force LICENSE,README.md,requirements.txt,start.bat,start_server.py,config.json $staging
          echo "DIGIB00AGE_STAGING=$staging" >> $env:GITHUB_ENV

      - name: Freeze with PyInstaller
        shell: pwsh
        run: |
          pyinstaller packaging/windows/digib00age.spec `
            --distpath packaging/windows/dist `
            --workpath packaging/windows/build

      - name: Install WiX Toolset CLI + UI extension
        # WiX v7 requires explicit, non-interactive acceptance of its Open
        # Source Maintenance Fee EULA before any wix.exe command will run
        # (enforced since v7, https://docs.firegiant.com/wix/osmf/ - the fee
        # itself only applies to orgs earning >$10k/year; a solo OSS project
        # owes nothing, but the EULA still has to be accepted explicitly).
        # -g installs the extension to the shared global extension cache
        # (~\.wix\extensions) rather than scoped to the current directory -
        # without it, the later "Build MSI" step (different working
        # directory) can't find it (WIX0144). Version pinned to match the
        # wix 7.0.0 CLI installed above.
        shell: pwsh
        run: |
          dotnet tool install --global wix
          wix extension add -g WixToolset.UI.wixext/7.0.0 -acceptEula wix7

      - name: Build MSI
        shell: pwsh
        working-directory: packaging/windows
        run: |
          wix build installer.wxs -ext WixToolset.UI.wixext -acceptEula wix7 `
            -d DistDir="dist\digib00age" -out digib00age-setup.msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: digib00age-setup-msi
          path: packaging/windows/digib00age-setup.msi
