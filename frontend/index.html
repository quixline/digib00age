<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>digib00age</title>
  <link rel="icon" href="/static/images/favicon.png">
  <script>(function(){var t=localStorage.getItem('cv_theme');if(t&&t!=='auto')document.documentElement.dataset.theme=t;})();</script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-page="library">

  <header class="site-header">
    <div class="sidebar-toggle-col">
      <button type="button" class="sidebar-toggle-btn" id="sidebarToggleBtn" title="Show/hide sidebar" aria-label="Show/hide sidebar">&#9776;</button>
    </div>
    <div class="sidebar-header-spacer"></div>
    <div class="container inner">
      <a href="/" class="site-logo">
        <img src="/static/images/lockup-light.png" alt="digib00age" class="site-logo-img site-logo-img--dark">
        <img src="/static/images/lockup-dark.png" alt="digib00age" class="site-logo-img site-logo-img--light">
      </a>

      <!-- Inline search (shown on Series/Singles/All surfaces) -->
      <div class="search-wrap" id="searchWrap" hidden>
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="Search…"
          autocomplete="off"
          spellcheck="false"
        >
        <button class="search-clear" id="searchClear" aria-label="Clear search">&#x2715;</button>
      </div>

      <a href="/admin" class="settings-btn" title="Admin / Settings" aria-label="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </a>
      <button type="button" class="btn-admin-action" id="logoutBtn" hidden>Logout</button>
    </div>
  </header>

  <div class="app-layout">
    <!-- ── APP SIDEBAR (v2.6 Item 1 Phase B) — replaces the old top surface
         tabs and header status-pills row; see CUSTOM_TABS_SPEC.md for the
         Libraries section's data source. ────────────────────────────────── -->
    <nav class="app-sidebar" id="appSidebar" aria-label="Main navigation">
      <div class="app-sidebar-section">
        <button class="app-sidebar-item active" data-surface="home" title="Home">
          <span class="app-sidebar-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></span><span class="app-sidebar-item-label">Home</span>
        </button>
        <button class="app-sidebar-item" data-surface="all" title="All">
          <span class="app-sidebar-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span><span class="app-sidebar-item-label">All</span>
        </button>
        <button class="app-sidebar-item" data-surface="singles" title="Singles">
          <span class="app-sidebar-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 3v18"/></svg></span><span class="app-sidebar-item-label">Singles</span>
        </button>
        <button class="app-sidebar-item" data-surface="series" title="Series">
          <span class="app-sidebar-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></span><span class="app-sidebar-item-label">Series</span>
        </button>
      </div>
      <div class="app-sidebar-divider"></div>
      <div class="app-sidebar-section">
        <button class="app-sidebar-item" data-quick-status="unread" title="Unread">
          <span class="app-sidebar-glyph">&#9675;</span><span class="app-sidebar-item-label">Unread</span>
        </button>
        <button class="app-sidebar-item" data-quick-status="reading" title="Reading">
          <span class="app-sidebar-glyph">&#9686;</span><span class="app-sidebar-item-label">Reading</span>
        </button>
        <button class="app-sidebar-item" data-quick-status="read" title="Read">
          <span class="app-sidebar-glyph">&#10003;</span><span class="app-sidebar-item-label">Read</span>
        </button>
      </div>
      <div class="app-sidebar-divider"></div>
      <div class="app-sidebar-section">
        <div class="section-label app-sidebar-section-label">Libraries</div>
        <div id="sidebarLibraries"></div>
      </div>
    </nav>

    <div class="app-content">
      <!-- ── UNIFIED MENU BAR (MENU_BAR_SPEC.md) — shared across all browse
           surfaces, Flat View and Folder View alike. Hidden on Home. ──────── -->
      <div class="menu-bar" id="menuBar" hidden>
       <div class="container menu-bar-inner">
        <select class="filter-select" id="sortSelect" aria-label="Sort by">
          <option value="alpha">A–Z</option>
          <option value="newest">Newest</option>
          <option value="recent">Recent</option>
          <option value="issues">Issues</option>
          <option value="pages" id="sortPagesOpt">Pages</option>
        </select>
        <span class="menu-bar-divider"></span>
        <button class="sort-dir-btn" id="sortDirBtn" title="Toggle ascending/descending">&#8593;</button>
        <span class="menu-bar-divider"></span>
        <button class="view-toggle-btn" id="viewToggle" title="Toggle list/grid view">&#9783;</button>
        <span class="menu-bar-divider"></span>
        <select class="filter-select" id="starRatingFilter" aria-label="Rated">
          <option value="">Rated</option>
          <option value="1">&#9733; 1</option>
          <option value="2">&#9733; 2</option>
          <option value="3">&#9733; 3</option>
          <option value="4">&#9733; 4</option>
          <option value="5">&#9733; 5</option>
        </select>
        <span class="menu-bar-divider"></span>
        <button class="fav-filter-btn" id="favFilterBtn" title="Show favourites only">&#9733; Favourites</button>
        <span class="menu-bar-divider"></span>

        <!-- Grouping — Flat browse surfaces only. Folder View already groups by
             directory structure, so "Group by" doesn't apply there. -->
        <select class="filter-select group-by-select" id="groupBySelect" aria-label="Group by">
          <option value="">No grouping</option>
          <option value="year">Year</option>
          <option value="genre">Genre</option>
          <option value="publisher">Publisher</option>
          <option value="writer">Writer</option>
          <option value="format">Format</option>
        </select>
        <span class="menu-bar-divider"></span>

        <!-- Secondary filters — shared by Flat browse and Folder View alike. -->
        <div class="browse-filters" id="browseFilters">
          <select class="filter-select" id="genreFilter"     aria-label="Genre"><option value="">Genre</option></select>
          <span class="menu-bar-divider"></span>
          <select class="filter-select" id="formatFilter"    aria-label="Format"><option value="">Format</option></select>
          <span class="menu-bar-divider"></span>
          <select class="filter-select" id="decadeFilter"    aria-label="Decade"><option value="">Decade</option></select>
          <span class="menu-bar-divider"></span>
          <select class="filter-select" id="yearFilter"      aria-label="Year"><option value="">Year</option></select>
          <span class="menu-bar-divider"></span>
          <select class="filter-select" id="ratingFilter"    aria-label="Rating"><option value="">Rating</option></select>
          <span class="menu-bar-divider"></span>
          <select class="filter-select" id="bwFilter"        aria-label="B&amp;W">
            <option value="">B&amp;W</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </div>

        <div class="menu-bar-trailing">
          <!-- Fieldview filter banner (BUG-015) — populated by renderFieldviewBanner() -->
          <p class="fieldview-banner" id="fieldviewBanner" hidden></p>
          <!-- Dropdown-filter Clear pill — same trailing slot as the fieldview
               banner's own Clear link, so both entry points land in the same
               place next to the count (Tez's tweak pass, 2026-07-09). -->
          <button class="filter-clear" id="filterClear">Clear Filter</button>
          <span class="browse-count" id="browseCount"></span>
        </div>
       </div>
      </div>

      <main class="container">

        <!-- Random cover background, shared by every surface below (INBOX
             2026-07-13; multi-cover cloud field 2026-07-15) — app.js's
             setPageBackground() composites several random covers scoped to
             whatever's actually shown on the active surface. -->
        <div class="page-bg" id="pageBg" hidden aria-hidden="true"></div>

        <!-- ── HOME SURFACE ──────────────────────────────────────────────── -->
        <div id="homeView">
          <div id="homeStrips">
            <div class="loading-state">Loading…</div>
          </div>
        </div>

        <!-- ── BROWSE SURFACES (Series / Singles / All) ────────────────────── -->
        <div id="browseView" hidden>

          <!-- Cover grid -->
          <div class="cover-grid" id="coverGrid">
            <div class="loading-state">Loading library…</div>
          </div>

          <!-- Pagination -->
          <div class="pagination" id="pagination"></div>
        </div>

        <!-- ── FOLDER VIEW (Custom Tabs, view_mode='folder' — CUSTOM_TABS_SPEC.md §9) -->
        <div id="folderView" hidden>
          <nav class="back-nav folder-view-nav">
            <a href="/" class="btn-primary" id="folderBackBtn">&#x2190; Back</a>
            <span class="folder-search-label" id="folderSearchLabel" hidden></span>
            <button class="btn-primary" id="folderMarkAllBtn">Mark all read</button>
          </nav>
          <div class="cover-grid" id="folderGrid">
            <div class="loading-state">Loading…</div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/filterDropdown.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
